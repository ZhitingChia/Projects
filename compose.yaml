services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifetracker}
      POSTGRES_USER: ${POSTGRES_USER:-lifetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lifetracker}
      DATABASE_USER: ${POSTGRES_USER:-lifetracker}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      SMTP_HOST: mailpit
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      GOOGLE_BOOKS_KEY: ${GOOGLE_BOOKS_KEY:-}
    volumes: ["artwork:/app/data/artwork"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}
volumes:
  postgres:
  artwork:
