name: Verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: bash backend/mvnw -B -ntp -f backend/pom.xml verify
      - run: npm ci && npm run build && npm test && npm audit --audit-level=high
        working-directory: frontend
      - run: docker compose -f compose.yaml -f compose.e2e.yaml up --build -d app
      - run: docker compose -f compose.yaml -f compose.e2e.yaml run --rm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - run: docker compose -f compose.yaml -f compose.e2e.yaml down
        if: always()
