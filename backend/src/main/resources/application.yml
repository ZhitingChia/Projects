server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lifetracker}
    username: ${DATABASE_USER:lifetracker}
    password: ${DATABASE_PASSWORD:local-development-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:library@lifetracker.local}
  storage:
    type: ${STORAGE_TYPE:local}
    path: ${ARTWORK_PATH:data/artwork}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-1}
  providers:
    google-url: ${GOOGLE_BOOKS_URL:https://www.googleapis.com/books/v1}
    google-key: ${GOOGLE_BOOKS_KEY:}
    openlibrary-url: ${OPEN_LIBRARY_URL:https://openlibrary.org}
